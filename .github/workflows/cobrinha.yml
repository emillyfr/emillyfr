name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#ff91a4&color_dots=#0d1117,#af677e,#ff91a4,#ff91a4,#ff91a4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff91a4&color_dots=#0d1117,#af677e,#ff91a4,#ff91a4,#ff91a4

      - name: Push Snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake"
          add: "dist"
